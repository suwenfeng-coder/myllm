services:
  minio:
    image: minio/minio
    container_name: minio-server
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  rag-hybrid:
    image: paradedb/paradedb@sha256:371e180894738e563404f10486835bcd86ca08eb36af1005bd69a1b0bedb40fe
    container_name: rag_hybrid
    restart: unless-stopped
    environment:
      POSTGRES_USER: pgvector
      POSTGRES_PASSWORD: pgvector
      POSTGRES_DB: myllm
    ports:
      - "5434:5432"
    volumes:
      - rag_hybrid_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgvector -d myllm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  minio_data:
    name: minio_data
  rag_hybrid_data:
    name: rag_hybrid_data
    external: true
